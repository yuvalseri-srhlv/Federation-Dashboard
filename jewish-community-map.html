<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3c72">
    <title>Jewish Community Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#e8f0fe',100:'#d1e1fd',200:'#a3c3fb',300:'#75a5f9',400:'#4787f7',500:'#2a5298',600:'#1e3c72',700:'#162d56',800:'#0f1e3a',900:'#070f1d' }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        /* === Tailwind vs Leaflet fix ===
           Tailwind Preflight sets *, *::before, *::after { box-sizing: border-box }
           and img { max-width:100% }. Both break Leaflet's internal positioning
           which relies on content-box sizing and unsized images for tiles. */
        .leaflet-container,
        .leaflet-container * ,
        .leaflet-container *::before,
        .leaflet-container *::after { box-sizing: content-box !important; }
        .leaflet-container img { max-width: none !important; max-height: none !important; }
        .leaflet-popup-content { margin: 8px 12px; }
        .leaflet-popup-content-wrapper { border-radius: 12px; }
        /* DivIcon containers: remove default white bg/border Leaflet adds */
        .custom-marker, .federation-marker { background: transparent !important; border: none !important; }
        /* Marker icon divs: border-box so border is included in width/height, matching iconSize */
        .custom-marker > div, .federation-marker > div { box-sizing: border-box !important; }
        /* Cluster overrides */
        .marker-cluster-small { background-color: rgba(181,226,140,0.6); }
        .marker-cluster-small div { background-color: rgba(110,204,57,0.6); }
        .marker-cluster-medium { background-color: rgba(241,211,87,0.6); }
        .marker-cluster-medium div { background-color: rgba(240,194,12,0.6); }
        .marker-cluster-large { background-color: rgba(253,156,115,0.6); }
        .marker-cluster-large div { background-color: rgba(241,128,23,0.6); }
        .marker-cluster div { width: 30px; height: 30px; margin-left: 5px; margin-top: 5px; text-align: center; border-radius: 50%; font: 12px/30px "Helvetica Neue", Arial, sans-serif; color: #333; font-weight: bold; }
        .marker-cluster { background-clip: padding-box; border-radius: 50%; }
        /* Sidebar scroll */
        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* Filter section */
        .filter-section { border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 12px; }
        .filter-cb { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; font-size: 0.875rem; }
        .filter-cb input { cursor: pointer; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">

<div x-cloak x-data="mapApp" class="flex h-screen w-screen">

    <!-- ==================== DESKTOP SIDEBAR ==================== -->
    <aside class="hidden md:flex md:flex-col w-80 bg-white shadow-lg z-[1100] flex-shrink-0">
        <!-- Header -->
        <div class="bg-brand-600 text-white p-4">
            <h1 class="text-lg font-bold">Jewish Community Map</h1>
            <p class="text-brand-200 text-xs mt-1" x-text="Object.keys(data.institutions).length + ' institutions mapped'"></p>
            <a href="federation-dashboard-v3.html" class="text-brand-200 hover:text-white text-xs underline mt-1 inline-block">&larr; Back to Dashboard</a>
        </div>

        <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-1">
            <!-- Search -->
            <div class="filter-section">
                <div class="relative">
                    <input type="text" x-model="searchTerm" @input="search()" placeholder="Search institutions, cities..."
                        class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-400">
                    <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <div x-show="searchResults.length > 0" class="mt-2 bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto">
                    <template x-for="r in searchResults" :key="r.id">
                        <button @click="goToResult(r)" class="w-full text-left px-3 py-2 hover:bg-brand-50 border-b last:border-0 text-sm">
                            <div class="font-medium" x-text="r.name"></div>
                            <div class="text-xs text-gray-500" x-text="r.subtitle"></div>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Show/Hide Toggles -->
            <div class="filter-section">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Display</h3>
                <label class="filter-cb"><input type="checkbox" x-model="showFederations" @change="refreshMarkers()"> <span class="color-dot" style="background:#1e3c72;border:2px solid #ca8a04"></span> Federations</label>
                <label class="filter-cb"><input type="checkbox" x-model="showBoundaries" @change="toggleBoundaries()"> <span class="color-dot" style="background:rgba(30,60,114,0.15);border:2px dashed #1e3c72"></span> Federation Boundaries</label>
                <label class="filter-cb"><input type="checkbox" x-model="showInstitutions" @change="refreshMarkers()"> <span class="color-dot" style="background:#2563eb"></span> Institutions</label>
                <label class="filter-cb"><input type="checkbox" x-model="filterShlichut" @change="refreshMarkers()"> <span class="color-dot" style="background:#ca8a04;display:flex;align-items:center;justify-content:center;font-size:9px;color:white;font-weight:bold">★</span> Shlichut Only</label>
            </div>

            <!-- Institution Type Filter -->
            <div class="filter-section">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">Institution Type</h3>
                    <div class="flex gap-1">
                        <button @click="setAllTypes(true)" class="text-xs text-brand-500 hover:underline">All</button>
                        <span class="text-gray-300">|</span>
                        <button @click="setAllTypes(false)" class="text-xs text-brand-500 hover:underline">None</button>
                    </div>
                </div>
                <template x-for="t in typeOptions" :key="t.key">
                    <label class="filter-cb">
                        <input type="checkbox" :checked="filterTypes[t.key]" @change="filterTypes[t.key] = !filterTypes[t.key]; refreshMarkers()">
                        <span class="color-dot" :style="'background:' + t.color"></span>
                        <span x-text="t.label"></span>
                        <span class="ml-auto text-xs text-gray-400" x-text="countByType(t.key)"></span>
                    </label>
                </template>
            </div>

            <!-- Denomination Filter -->
            <div class="filter-section">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">Denomination</h3>
                    <div class="flex gap-1">
                        <button @click="setAllDenoms(true)" class="text-xs text-brand-500 hover:underline">All</button>
                        <span class="text-gray-300">|</span>
                        <button @click="setAllDenoms(false)" class="text-xs text-brand-500 hover:underline">None</button>
                    </div>
                </div>
                <template x-for="d in denomOptions" :key="d.key">
                    <label class="filter-cb">
                        <input type="checkbox" :checked="filterDenoms[d.key]" @change="filterDenoms[d.key] = !filterDenoms[d.key]; refreshMarkers()">
                        <span class="color-dot" :style="'background:' + d.color"></span>
                        <span x-text="d.label"></span>
                        <span class="ml-auto text-xs text-gray-400" x-text="countByDenom(d.key)"></span>
                    </label>
                </template>
            </div>

            <!-- State Filter -->
            <div class="filter-section">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">States</h3>
                    <div class="flex gap-1">
                        <button @click="setAllStates(true)" class="text-xs text-brand-500 hover:underline">All</button>
                        <span class="text-gray-300">|</span>
                        <button @click="setAllStates(false)" class="text-xs text-brand-500 hover:underline">None</button>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-1">
                    <template x-for="s in stateOptions" :key="s">
                        <label class="filter-cb text-xs">
                            <input type="checkbox" :checked="filterStates[s] !== false" @change="filterStates[s] = filterStates[s] !== false ? false : true; refreshMarkers()">
                            <span x-text="s"></span>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Stats -->
            <div class="filter-section">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Statistics</h3>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div class="bg-brand-50 rounded-lg p-2 text-center">
                        <div class="text-lg font-bold text-brand-600" x-text="Object.keys(data.federations).length"></div>
                        <div class="text-xs text-gray-500">Federations</div>
                    </div>
                    <div class="bg-blue-50 rounded-lg p-2 text-center">
                        <div class="text-lg font-bold text-blue-600" x-text="Object.keys(data.institutions).length"></div>
                        <div class="text-xs text-gray-500">Institutions</div>
                    </div>
                    <div class="bg-amber-50 rounded-lg p-2 text-center">
                        <div class="text-lg font-bold text-amber-600" x-text="countShlichut()"></div>
                        <div class="text-xs text-gray-500">With Shlichim</div>
                    </div>
                    <div class="bg-green-50 rounded-lg p-2 text-center">
                        <div class="text-lg font-bold text-green-600" x-text="visibleCount"></div>
                        <div class="text-xs text-gray-500">Showing on map</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Actions</h3>
                <button @click="openAddModal()" class="w-full bg-brand-500 hover:bg-brand-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition">+ Add Institution</button>
                <label class="w-full bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition text-center cursor-pointer block">
                    Upload Excel
                    <input type="file" accept=".xlsx,.xls,.csv" @change="importExcel($event)" class="hidden">
                </label>
                <div x-show="uploadProgress" class="bg-amber-50 border border-amber-200 rounded-lg p-2 text-xs text-amber-700">
                    <div class="flex justify-between mb-1"><span x-text="uploadProgress"></span></div>
                    <div class="w-full bg-amber-200 rounded-full h-1.5"><div class="bg-amber-500 h-1.5 rounded-full transition-all" :style="'width:' + uploadPct + '%'"></div></div>
                </div>
                <button @click="exportData()" class="w-full bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition">Export JSON</button>
                <div class="flex gap-2">
                    <label class="flex-1 bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition text-center cursor-pointer">
                        Import JSON
                        <input type="file" accept=".json" @change="importData($event)" class="hidden">
                    </label>
                    <button @click="resetData()" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-lg text-sm font-medium transition">Reset</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- ==================== MOBILE SIDEBAR OVERLAY ==================== -->
    <div x-show="sidebarOpen" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="md:hidden fixed inset-0 z-[1200] bg-black/40" @click.self="sidebarOpen = false">
        <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-full"
             x-transition:enter-end="translate-y-0" x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full"
             class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl max-h-[75vh] overflow-y-auto sidebar-scroll p-4 space-y-1">
            <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-3"></div>
            <h2 class="font-bold text-brand-600 mb-2">Filters & Search</h2>

            <!-- Search -->
            <div class="filter-section">
                <div class="relative">
                    <input type="text" x-model="searchTerm" @input="search()" placeholder="Search..."
                        class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-400">
                    <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <div x-show="searchResults.length > 0" class="mt-2 bg-white border rounded-lg shadow-lg max-h-36 overflow-y-auto">
                    <template x-for="r in searchResults" :key="r.id">
                        <button @click="goToResult(r); sidebarOpen = false" class="w-full text-left px-3 py-2 hover:bg-brand-50 border-b text-sm">
                            <div class="font-medium" x-text="r.name"></div>
                            <div class="text-xs text-gray-500" x-text="r.subtitle"></div>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Toggles -->
            <div class="filter-section">
                <label class="filter-cb"><input type="checkbox" x-model="showFederations" @change="refreshMarkers()"> Federations</label>
                <label class="filter-cb"><input type="checkbox" x-model="showBoundaries" @change="toggleBoundaries()"> Boundaries</label>
                <label class="filter-cb"><input type="checkbox" x-model="showInstitutions" @change="refreshMarkers()"> Institutions</label>
                <label class="filter-cb"><input type="checkbox" x-model="filterShlichut" @change="refreshMarkers()"> ★ Shlichut Only</label>
            </div>

            <!-- Type filters -->
            <div class="filter-section">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Type</h3>
                <template x-for="t in typeOptions" :key="t.key">
                    <label class="filter-cb">
                        <input type="checkbox" :checked="filterTypes[t.key]" @change="filterTypes[t.key] = !filterTypes[t.key]; refreshMarkers()">
                        <span class="color-dot" :style="'background:' + t.color"></span> <span x-text="t.label"></span>
                    </label>
                </template>
            </div>

            <!-- Denom filters -->
            <div class="filter-section">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Denomination</h3>
                <template x-for="d in denomOptions" :key="d.key">
                    <label class="filter-cb">
                        <input type="checkbox" :checked="filterDenoms[d.key]" @change="filterDenoms[d.key] = !filterDenoms[d.key]; refreshMarkers()">
                        <span class="color-dot" :style="'background:' + d.color"></span> <span x-text="d.label"></span>
                    </label>
                </template>
            </div>

            <!-- State filters -->
            <div class="filter-section">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">States</h3>
                <div class="grid grid-cols-4 gap-1">
                    <template x-for="s in stateOptions" :key="s">
                        <label class="filter-cb text-xs"><input type="checkbox" :checked="filterStates[s] !== false" @change="filterStates[s] = filterStates[s] !== false ? false : true; refreshMarkers()"> <span x-text="s"></span></label>
                    </template>
                </div>
            </div>

            <button @click="openAddModal(); sidebarOpen = false" class="w-full bg-brand-500 text-white px-3 py-2 rounded-lg text-sm font-medium">+ Add Institution</button>
            <label class="w-full bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition text-center cursor-pointer block mt-2">
                Upload Excel
                <input type="file" accept=".xlsx,.xls,.csv" @change="importExcel($event); sidebarOpen = false" class="hidden">
            </label>
        </div>
    </div>

    <!-- ==================== MAP ==================== -->
    <div class="flex-1 relative">
        <div id="map" class="w-full h-full"></div>
        <!-- Mobile FAB -->
        <button @click="sidebarOpen = !sidebarOpen"
            class="md:hidden fixed bottom-6 left-6 z-[1100] bg-brand-600 hover:bg-brand-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        </button>
    </div>

    <!-- ==================== ADD/EDIT MODAL ==================== -->
    <div x-show="showModal" class="fixed inset-0 z-[1300] flex items-center justify-center bg-black/50 p-4" @click.self="showModal = false">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6" @click.stop>
            <h2 class="text-xl font-bold text-brand-600 mb-4" x-text="editingId ? 'Edit Institution' : 'Add Institution'"></h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                    <input type="text" x-model="form.name" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                        <select x-model="form.type" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                            <template x-for="t in typeOptions" :key="t.key"><option :value="t.key" x-text="t.label"></option></template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Denomination</label>
                        <select x-model="form.denomination" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                            <template x-for="d in denomOptions" :key="d.key"><option :value="d.key" x-text="d.label"></option></template>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <input type="text" x-model="form.address" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                        <input type="text" x-model="form.city" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
                        <input type="text" x-model="form.state" placeholder="e.g. NY, CA, TX" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                        <input type="number" step="0.0001" x-model.number="form.lat" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                        <input type="number" step="0.0001" x-model.number="form.lng" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                </div>
                <button @click="pickLocation()" class="text-sm text-brand-500 hover:underline" x-show="!pickingLocation">
                    Click map to set location
                </button>
                <div x-show="pickingLocation" class="text-sm text-orange-600 font-medium bg-orange-50 p-2 rounded-lg">
                    Click on the map to place the marker...
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="text" x-model="form.phone" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
                        <input type="text" x-model="form.website" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Federation</label>
                    <select x-model="form.federationId" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
                        <option value="">None</option>
                        <template x-for="f in Object.values(data.federations).sort((a,b)=>a.name.localeCompare(b.name))" :key="f.id">
                            <option :value="f.id" x-text="f.shortName || f.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="filter-cb text-sm"><input type="checkbox" x-model="form.hasShlichut"> <span class="font-medium text-gray-700">★ Has Shlichut Aruka</span></label>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                    <textarea x-model="form.notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none"></textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="saveInstitution()" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg font-medium transition" x-text="editingId ? 'Save Changes' : 'Add Institution'"></button>
                <button @click="showModal = false; pickingLocation = false" class="px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-50 transition">Cancel</button>
            </div>
        </div>
    </div>

</div>

<!-- ==================== JAVASCRIPT ==================== -->
<script>
// =============================================
// SEED DATA - FEDERATIONS
// =============================================

// =============================================
// LOCAL STORAGE
// =============================================
const STORAGE_KEY = 'jewish-community-map-v1';
const store = {
    save(data) {
        data._lastModified = new Date().toISOString();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        catch(e) { console.error('Save failed:', e); if(e.name==='QuotaExceededError') alert('Storage full! Export data and clear some items.'); }
    },
    load() {
        try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; }
        catch(e) { return null; }
    },
    clear() { localStorage.removeItem(STORAGE_KEY); }
};

// =============================================
// ALPINE COMPONENT
// =============================================
let appRef = null;

document.addEventListener('alpine:init', () => {
    Alpine.data('mapApp', () => ({
        // --- State ---
        data: { _version:3, federations:{}, institutions:{}, settings:{} },
        map: null,
        sidebarOpen: false,
        showModal: false,
        editingId: null,
        uploadProgress: '',
        uploadPct: 0,
        pickingLocation: false,
        searchTerm: '',
        searchResults: [],
        _searchTimeout: null,
        visibleCount: 0,

        // Filter state
        showFederations: true,
        showBoundaries: false,
        showInstitutions: true,
        filterTypes: { jcc:true, synagogue:true, jewish_center:true, congregation:true, day_school:true, hillel:true, youth:true, other:true },
        filterDenoms: { orthodox:true, modern_orthodox:true, conservative:true, reform:true, chabad:true, reconstructionist:true, unaffiliated:true, other:true },
        filterStates: {},
        filterShlichut: false,

        // Form
        form: { name:'',type:'synagogue',denomination:'other',address:'',city:'',state:'NY',lat:null,lng:null,phone:'',website:'',federationId:'',notes:'',hasShlichut:false },

        // Leaflet layers
        _federationLayer: null,
        _boundaryLayer: null,
        _institutionCluster: null,
        _tempMarker: null,
        _markers: {},

        // Options
        typeOptions: [
            {key:'jcc',label:'JCC',color:'#16a34a'},
            {key:'synagogue',label:'Synagogue',color:'#2563eb'},
            {key:'jewish_center',label:'Jewish Center',color:'#9333ea'},
            {key:'congregation',label:'Congregation',color:'#ea580c'},
            {key:'day_school',label:'Day School',color:'#0d9488'},
            {key:'hillel',label:'Hillel',color:'#db2777'},
            {key:'youth',label:'Youth Program',color:'#f59e0b'},
            {key:'other',label:'Other',color:'#64748b'}
        ],
        denomOptions: [
            {key:'orthodox',label:'Orthodox',color:'#1e3a5f'},
            {key:'modern_orthodox',label:'Modern Orthodox',color:'#3b82f6'},
            {key:'conservative',label:'Conservative',color:'#15803d'},
            {key:'reform',label:'Reform',color:'#dc2626'},
            {key:'chabad',label:'Chabad',color:'#ca8a04'},
            {key:'reconstructionist',label:'Reconstructionist',color:'#7c3aed'},
            {key:'unaffiliated',label:'Unaffiliated',color:'#9ca3af'},
            {key:'other',label:'Other',color:'#475569'}
        ],
        get stateOptions() { return [...new Set(Object.values(this.data.institutions).map(i => i.state).filter(Boolean))].sort(); },

        // --- Lifecycle ---
        init() {
            appRef = this;
            const saved = store.load();
            if (saved && saved._version && saved.federations) {
                this.data = saved;
                this.mergeSeedData();
                if (this.data._version < 3) { this.data._version = 3; store.save(this.data); }
            } else {
                this.data = {
                    _version: 3,
                    _lastModified: new Date().toISOString(),
                    federations: {},
                    institutions: {},
                    settings: {}
                };
                store.save(this.data);
            }
            // Restore filter settings
            if (this.data.settings && this.data.settings.filters) {
                const f = this.data.settings.filters;
                if (f.types) this.filterTypes = f.types;
                if (f.denoms) this.filterDenoms = f.denoms;
                if (f.states) this.filterStates = f.states;
                if (f.showFederations !== undefined) this.showFederations = f.showFederations;
                if (f.showBoundaries !== undefined) this.showBoundaries = f.showBoundaries;
                if (f.showInstitutions !== undefined) this.showInstitutions = f.showInstitutions;
                if (f.filterShlichut !== undefined) this.filterShlichut = f.filterShlichut;
            }
            this.$nextTick(() => this.initMap());
        },

        mergeSeedData() {
            let changed = false;
            for (const k of Object.keys(this.data.federations)) {
                if (!SEED_FEDERATIONS[k]) { delete this.data.federations[k]; changed = true; }
            }
            for (const [k, v] of Object.entries(SEED_FEDERATIONS)) {
                if (!this.data.federations[k]) {
                    this.data.federations[k] = JSON.parse(JSON.stringify(v));
                    changed = true;
                } else {
                    const existing = this.data.federations[k];
                    if (JSON.stringify(existing.boundary) !== JSON.stringify(v.boundary)) {
                        existing.boundary = v.boundary ? JSON.parse(JSON.stringify(v.boundary)) : null;
                        changed = true;
                    }
                    if (v.boundaryColor && existing.boundaryColor !== v.boundaryColor) {
                        existing.boundaryColor = v.boundaryColor;
                        changed = true;
                    }
                }
            }
            const seedIds = new Set(SEED_INSTITUTIONS.map(i => i.id));
            for (const id of Object.keys(this.data.institutions)) {
                const existing = this.data.institutions[id];
                if (existing.addedBy === 'seed' && !seedIds.has(id)) {
                    delete this.data.institutions[id];
                    changed = true;
                }
            }
            const syncFields = ['name','type','denomination','lat','lng','address','city','state','federationId','phone','website','notes','hasShlichut'];
            for (const inst of SEED_INSTITUTIONS) {
                if (!this.data.institutions[inst.id]) {
                    this.data.institutions[inst.id] = { ...inst, addedBy:'seed', createdAt:new Date().toISOString() };
                    changed = true;
                } else {
                    const existing = this.data.institutions[inst.id];
                    if (existing.addedBy !== 'seed') continue;
                    for (const f of syncFields) {
                        const seedVal = inst[f] === undefined ? '' : inst[f];
                        const existingVal = existing[f] === undefined ? '' : existing[f];
                        if (existingVal !== seedVal) { existing[f] = seedVal; changed = true; }
                    }
                }
            }
            if (changed) store.save(this.data);
        },

        // --- Map ---
        initMap() {
            this.map = L.map('map', { center:[41.2,-74.0], zoom:7, minZoom:5, maxZoom:18, zoomControl:true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom:19
            }).addTo(this.map);

            this._federationLayer = L.layerGroup().addTo(this.map);
            this._boundaryLayer = L.layerGroup();
            this._institutionCluster = L.markerClusterGroup({
                maxClusterRadius:50, spiderfyOnMaxZoom:true, showCoverageOnHover:false,
                zoomToBoundsOnClick:true, disableClusteringAtZoom:16
            }).addTo(this.map);

            this.refreshMarkers();
            this.map.fitBounds([[38.45,-80.3],[47.5,-66.9]]);
        },

        refreshMarkers() {
            this._federationLayer.clearLayers();
            this._institutionCluster.clearLayers();
            this._markers = {};
            let count = 0;

            // Federation markers
            if (this.showFederations) {
                for (const fed of Object.values(this.data.federations)) {
                    if (this.filterStates[fed.state] === false) continue;
                    const marker = L.marker([fed.lat, fed.lng], { icon: this.createFederationIcon() });
                    marker.bindPopup(this.federationPopup(fed), { maxWidth:320 });
                    this._federationLayer.addLayer(marker);
                    this._markers['fed_'+fed.id] = marker;
                    count++;
                }
            }

            // Institution markers
            if (this.showInstitutions) {
                for (const inst of Object.values(this.data.institutions)) {
                    if (!this.filterTypes[inst.type]) continue;
                    if (!this.filterDenoms[inst.denomination]) continue;
                    if (this.filterStates[inst.state] === false) continue;
                    if (this.filterShlichut && !inst.hasShlichut) continue;
                    const marker = L.marker([inst.lat, inst.lng], { icon: this.createInstitutionIcon(inst.type, inst.denomination, inst.hasShlichut) });
                    marker.bindPopup(this.institutionPopup(inst), { maxWidth:300 });
                    this._institutionCluster.addLayer(marker);
                    this._markers['inst_'+inst.id] = marker;
                    count++;
                }
            }

            this.visibleCount = count;
            this.saveFilters();
        },

        toggleBoundaries() {
            if (this.showBoundaries) {
                this._boundaryLayer.clearLayers();
                for (const fed of Object.values(this.data.federations)) {
                    if (!fed.boundary) continue;
                    if (this.filterStates[fed.state] === false) continue;
                    const layer = L.geoJSON(fed.boundary, {
                        style: { color:fed.boundaryColor, weight:2, opacity:0.7, fillColor:fed.boundaryColor, fillOpacity:0.10, dashArray:'5,5' }
                    });
                    layer.bindTooltip(fed.shortName || fed.name, { sticky:true, className:'font-medium' });
                    layer.on('mouseover', function(e) { e.target.setStyle({fillOpacity:0.25}); });
                    layer.on('mouseout', function(e) { e.target.setStyle({fillOpacity:0.10}); });
                    this._boundaryLayer.addLayer(layer);
                }
                this._boundaryLayer.addTo(this.map);
            } else {
                this.map.removeLayer(this._boundaryLayer);
            }
            this.saveFilters();
        },

        // --- Icons ---
        createFederationIcon() {
            return L.divIcon({
                className:'federation-marker',
                html:'<div style="box-sizing:border-box;width:34px;height:34px;border-radius:50%;background:#1e3c72;border:3px solid #ca8a04;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,0.4);color:white;font-size:16px;font-weight:bold;">&#x2721;</div>',
                iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-19]
            });
        },

        createInstitutionIcon(type, denom, hasShlichut) {
            const tc = {jcc:'#16a34a',synagogue:'#2563eb',jewish_center:'#9333ea',congregation:'#ea580c',day_school:'#0d9488',hillel:'#db2777',youth:'#f59e0b',other:'#64748b'};
            const dc = {orthodox:'#1e3a5f',modern_orthodox:'#3b82f6',conservative:'#15803d',reform:'#dc2626',chabad:'#ca8a04',reconstructionist:'#7c3aed',unaffiliated:'#9ca3af',other:'#475569'};
            const initials = {jcc:'J',synagogue:'S',jewish_center:'C',congregation:'G',day_school:'D',hillel:'H',youth:'Y',other:'?'};
            const bg = tc[type]||'#64748b', ring = dc[denom]||'#9ca3af', letter = initials[type]||'?';
            const badge = hasShlichut ? '<div style="position:absolute;top:-5px;right:-5px;width:14px;height:14px;background:#ca8a04;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:white;line-height:1;">★</div>' : '';
            return L.divIcon({
                className:'custom-marker',
                html:`<div style="box-sizing:border-box;position:relative;width:26px;height:26px;border-radius:50%;background:${bg};border:3px solid ${ring};display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);color:white;font-size:11px;font-weight:bold;">${letter}${badge}</div>`,
                iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-15]
            });
        },

        // --- Popups ---
        federationPopup(f) {
            let html = `<div style="min-width:200px"><h3 style="font-weight:bold;font-size:16px;color:#1e3c72;margin:0 0 6px">${this.esc(f.name)}</h3>`;
            if (f.address) html += `<p style="font-size:13px;color:#666;margin:2px 0">${this.esc(f.address)}</p>`;
            if (f.jewishPop) html += `<p style="font-size:13px;margin:2px 0">Jewish Pop: <b>${this.esc(f.jewishPop)}</b></p>`;
            if (f.phone) html += `<p style="font-size:13px;margin:2px 0">Phone: ${this.esc(f.phone)}</p>`;
            if (f.website) html += `<p style="margin:6px 0"><a href="${this.esc(f.website)}" target="_blank" rel="noopener" style="color:#2563eb;font-size:13px">Visit Website</a></p>`;
            html += `</div>`;
            return html;
        },

        institutionPopup(inst) {
            const tl = this.typeLabel(inst.type), dl = this.denomLabel(inst.denomination);
            const tc = {jcc:'#dcfce7',synagogue:'#dbeafe',jewish_center:'#f3e8ff',congregation:'#fff7ed',day_school:'#ccfbf1',hillel:'#fce7f3',other:'#f1f5f9'};
            const tfc = {jcc:'#166534',synagogue:'#1e40af',jewish_center:'#6b21a8',congregation:'#9a3412',day_school:'#115e59',hillel:'#9d174d',other:'#334155'};
            let html = `<div style="min-width:180px"><h3 style="font-weight:bold;font-size:15px;margin:0 0 6px">${this.esc(inst.name)}</h3>`;
            if (inst.hasShlichut) html += `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:#fef3c7;color:#92400e;margin-right:4px;margin-bottom:4px">★ Shlichut Aruka</span>`;
            html += `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:${tc[inst.type]||'#f1f5f9'};color:${tfc[inst.type]||'#334155'};margin-right:4px">${tl}</span>`;
            html += `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:#f0f0f0;color:#333">${dl}</span>`;
            if (inst.address) html += `<p style="font-size:12px;color:#666;margin:6px 0 2px">${this.esc(inst.address)}</p>`;
            if (inst.phone) html += `<p style="font-size:12px;color:#666;margin:2px 0">Phone: ${this.esc(inst.phone)}</p>`;
            if (inst.notes) html += `<p style="font-size:12px;color:#444;margin:6px 0 2px;padding-top:4px;border-top:1px solid #e5e7eb">${this.esc(inst.notes)}</p>`;
            html += `<div style="margin-top:8px;display:flex;gap:8px">`;
            if (inst.website) html += `<a href="${this.esc(inst.website)}" target="_blank" rel="noopener" style="color:#2563eb;font-size:12px">Website</a>`;
            html += `<a href="#" onclick="appRef.editInst('${inst.id}');return false" style="color:#2a5298;font-size:12px">Edit</a>`;
            html += `<a href="#" onclick="appRef.deleteInst('${inst.id}');return false" style="color:#dc2626;font-size:12px">Delete</a>`;
            html += `</div></div>`;
            return html;
        },

        // --- Search ---
        search() {
            clearTimeout(this._searchTimeout);
            this._searchTimeout = setTimeout(() => {
                const t = this.searchTerm.toLowerCase().trim();
                if (!t || t.length < 2) { this.searchResults = []; return; }
                const results = [];
                for (const fed of Object.values(this.data.federations)) {
                    if (fed.name.toLowerCase().includes(t) || (fed.address||'').toLowerCase().includes(t) || (fed.shortName||'').toLowerCase().includes(t)) {
                        results.push({type:'federation',id:'fed_'+fed.id,name:fed.name,subtitle:fed.state,lat:fed.lat,lng:fed.lng});
                    }
                }
                for (const inst of Object.values(this.data.institutions)) {
                    if (inst.name.toLowerCase().includes(t) || (inst.address||'').toLowerCase().includes(t) || (inst.city||'').toLowerCase().includes(t)) {
                        results.push({type:'institution',id:'inst_'+inst.id,name:inst.name,subtitle:`${this.typeLabel(inst.type)} - ${inst.city||''}, ${inst.state}`,lat:inst.lat,lng:inst.lng});
                    }
                }
                this.searchResults = results.slice(0, 20);
            }, 300);
        },

        goToResult(r) {
            this.map.setView([r.lat, r.lng], 15);
            const marker = this._markers[r.id];
            if (marker) {
                if (this._institutionCluster.hasLayer && this._institutionCluster.hasLayer(marker)) {
                    this._institutionCluster.zoomToShowLayer(marker, () => marker.openPopup());
                } else {
                    marker.openPopup();
                }
            }
            this.searchResults = [];
            this.searchTerm = '';
        },

        // --- CRUD ---
        openAddModal() {
            this.editingId = null;
            this.form = {name:'',type:'synagogue',denomination:'other',address:'',city:'',state:'NY',lat:null,lng:null,phone:'',website:'',federationId:'',notes:'',hasShlichut:false};
            this.showModal = true;
        },

        editInst(id) {
            const inst = this.data.institutions[id];
            if (!inst) return;
            this.map.closePopup();
            this.editingId = id;
            this.form = { ...inst };
            this.showModal = true;
        },

        deleteInst(id) {
            if (!confirm('Delete this institution?')) return;
            this.map.closePopup();
            delete this.data.institutions[id];
            store.save(this.data);
            this.refreshMarkers();
        },

        saveInstitution() {
            if (!this.form.name.trim()) { alert('Name is required'); return; }
            if (!this.form.lat || !this.form.lng) { alert('Latitude and Longitude are required. Use "Click map to set location".'); return; }
            if (this.editingId) {
                this.data.institutions[this.editingId] = { ...this.data.institutions[this.editingId], ...this.form };
            } else {
                const id = 'inst_user_' + Date.now();
                this.data.institutions[id] = { ...this.form, id, addedBy:'user', createdAt:new Date().toISOString() };
            }
            store.save(this.data);
            this.showModal = false;
            this.pickingLocation = false;
            if (this._tempMarker) { this.map.removeLayer(this._tempMarker); this._tempMarker = null; }
            this.refreshMarkers();
        },

        pickLocation() {
            this.pickingLocation = true;
            this.map.once('click', (e) => {
                this.form.lat = parseFloat(e.latlng.lat.toFixed(6));
                this.form.lng = parseFloat(e.latlng.lng.toFixed(6));
                this.pickingLocation = false;
                if (this._tempMarker) this.map.removeLayer(this._tempMarker);
                this._tempMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(this.map);
            });
        },

        // --- Filter helpers ---
        setAllTypes(val) { for (const k in this.filterTypes) this.filterTypes[k] = val; this.refreshMarkers(); },
        setAllDenoms(val) { for (const k in this.filterDenoms) this.filterDenoms[k] = val; this.refreshMarkers(); },
        setAllStates(val) { for (const s of this.stateOptions) this.filterStates[s] = val; this.refreshMarkers(); },
        countByType(type) { return Object.values(this.data.institutions).filter(i => i.type === type).length; },
        countByDenom(denom) { return Object.values(this.data.institutions).filter(i => i.denomination === denom).length; },
        countShlichut() { return Object.values(this.data.institutions).filter(i => i.hasShlichut).length; },

        saveFilters() {
            this.data.settings.filters = {
                types: {...this.filterTypes}, denoms: {...this.filterDenoms}, states: {...this.filterStates}, filterShlichut: this.filterShlichut,
                showFederations: this.showFederations, showBoundaries: this.showBoundaries, showInstitutions: this.showInstitutions
            };
            store.save(this.data);
        },

        // --- Excel upload with geocoding ---
        async importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const ab = await file.arrayBuffer();
                const wb = XLSX.read(ab);
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws);
                if (rows.length === 0) { alert('No data found in file'); return; }
                const needGeocode = [];
                const direct = [];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const name = (row.Name || row.name || row['Institution Name'] || row['institution name'] || '').toString().trim();
                    if (!name) continue;
                    const typeRaw = (row.Type || row.type || 'other').toString().trim().toLowerCase().replace(/\s+/g, '_');
                    const denomRaw = (row.Denomination || row.denomination || 'other').toString().trim().toLowerCase().replace(/\s+/g, '_');
                    const city = (row.City || row.city || '').toString().trim();
                    const state = (row.State || row.state || '').toString().trim();
                    const address = (row.Address || row.address || '').toString().trim();
                    const federation = (row.Federation || row.federation || '').toString().trim();
                    const shlichutVal = row['Has Shlichut'] || row.hasShlichut || row.Shlichut || row.shlichut || '';
                    const hasShlichut = shlichutVal === true || shlichutVal === 1 || (shlichutVal.toString().toLowerCase() === 'yes') || (shlichutVal.toString().toLowerCase() === 'true');
                    const lat = parseFloat(row.Lat || row.lat || row.Latitude || row.latitude || '');
                    const lng = parseFloat(row.Lng || row.lng || row.Longitude || row.longitude || row.Long || row.long || '');
                    const entry = { name, type: typeRaw, denomination: denomRaw, city, state, address, federation, hasShlichut, lat, lng, idx: i };
                    if (!isNaN(lat) && !isNaN(lng)) direct.push(entry);
                    else needGeocode.push(entry);
                }
                let added = 0, failed = 0;
                const total = direct.length + needGeocode.length;
                for (const e of direct) {
                    const id = 'xl_' + Date.now().toString(36) + '_' + e.idx;
                    this.data.institutions[id] = { id, name: e.name, type: e.type, denomination: e.denomination, lat: e.lat, lng: e.lng, city: e.city, state: e.state, federationId: e.federation || null, hasShlichut: e.hasShlichut, addedBy: 'excel', createdAt: new Date().toISOString() };
                    added++;
                }
                if (needGeocode.length > 0) {
                    this.uploadProgress = 'Geocoding 0/' + needGeocode.length + '...';
                    this.uploadPct = 0;
                    for (let i = 0; i < needGeocode.length; i++) {
                        const e = needGeocode[i];
                        this.uploadProgress = 'Geocoding ' + (i+1) + '/' + needGeocode.length + ': ' + e.name.substring(0, 25);
                        this.uploadPct = Math.round(((i+1) / needGeocode.length) * 100);
                        const query = [e.name, e.address, e.city, e.state].filter(Boolean).join(', ');
                        const coords = await this.geocodeAddress(query);
                        if (coords) {
                            const id = 'xl_' + Date.now().toString(36) + '_' + e.idx;
                            this.data.institutions[id] = { id, name: e.name, type: e.type, denomination: e.denomination, lat: coords.lat, lng: coords.lng, city: e.city, state: e.state, federationId: e.federation || null, hasShlichut: e.hasShlichut, addedBy: 'excel', createdAt: new Date().toISOString() };
                            added++;
                        } else { failed++; }
                        if (i < needGeocode.length - 1) await new Promise(r => setTimeout(r, 1100));
                    }
                    this.uploadProgress = '';
                    this.uploadPct = 0;
                }
                store.save(this.data);
                this.refreshMarkers();
                this.fitMapToData();
                alert('Imported ' + added + ' institutions.' + (failed > 0 ? ' ' + failed + ' failed (could not geocode).' : ''));
            } catch(err) { alert('Error reading file: ' + err.message); }
            event.target.value = '';
        },

        async geocodeAddress(query) {
            try {
                const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query), { headers: { 'User-Agent': 'JewishCommunityMap/1.0' } });
                const data = await res.json();
                if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                return null;
            } catch(e) { return null; }
        },

        fitMapToData() {
            const insts = Object.values(this.data.institutions);
            if (insts.length === 0) return;
            const valid = insts.filter(i => i.lat && i.lng);
            if (valid.length === 0) return;
            const bounds = L.latLngBounds(valid.map(i => [i.lat, i.lng]));
            this.map.fitBounds(bounds, { padding: [50, 50] });
        },

        // --- Data management ---
        exportData() {
            const blob = new Blob([JSON.stringify(this.data, null, 2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'jewish-community-map-' + new Date().toISOString().slice(0,10) + '.json';
            a.click(); URL.revokeObjectURL(url);
        },

        importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.federations || !imported.institutions) { alert('Invalid file format'); return; }
                    if (!confirm('This will replace all current data. Continue?')) return;
                    this.data = imported;
                    store.save(this.data);
                    this.refreshMarkers();
                    if (this.showBoundaries) this.toggleBoundaries();
                    alert('Data imported successfully!');
                } catch(err) { alert('Error reading file: ' + err.message); }
            };
            reader.readAsText(file);
            event.target.value = '';
        },

        resetData() {
            if (!confirm('Reset ALL data? This cannot be undone.')) return;
            if (!confirm('Are you sure? All institutions will be removed.')) return;
            store.clear();
            this.data = { _version:3, _lastModified:new Date().toISOString(), federations:{}, institutions:{}, settings:{} };
            store.save(this.data);
            // Reset filters
            this.showFederations = true; this.showBoundaries = false; this.showInstitutions = true;
            for (const k in this.filterTypes) this.filterTypes[k] = true;
            for (const k in this.filterDenoms) this.filterDenoms[k] = true;
            this.filterStates = {};
            this.filterShlichut = false;
            this.refreshMarkers();
            this._boundaryLayer.clearLayers();
            this.map.removeLayer(this._boundaryLayer);
        },

        // --- Helpers ---
        typeLabel(t) { const m={jcc:'JCC',synagogue:'Synagogue',jewish_center:'Jewish Center',congregation:'Congregation',day_school:'Day School',hillel:'Hillel',youth:'Youth Program',other:'Other'}; return m[t]||t; },
        denomLabel(d) { const m={orthodox:'Orthodox',modern_orthodox:'Modern Orthodox',conservative:'Conservative',reform:'Reform',chabad:'Chabad',reconstructionist:'Reconstructionist',unaffiliated:'Unaffiliated',other:'Other'}; return m[d]||d; },
        esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    }));
});
</script>

</body>
